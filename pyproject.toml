[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spriteforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26", "pydantic>=2", "httpx>=0.27", "typer>=0.12", "fastapi>=0.115", "uvicorn>=0.31.1", "pyyaml>=6", "python-dotenv>=1", "mcp>=1.28,<2", "sse-starlette>=1.6.1,<3", "jsonschema>=4", "playwright>=1.48"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "playwright>=1.48"]

[project.scripts]
spriteforge = "spriteforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spriteforge = ["config.yaml", "app/*.html", "pixel/palettes/*.json", "memory/okf/seeds/*.yaml", "agents/roles/*.md", "skills/builtin/*/SKILL.md", "mcp/templates/*.json", "prompts/*.txt", "templates/phaser/*", "templates/phaser/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

