workspace: ~/spriteforge-workspace
router:
  enabled: true
  max_skills: 3
  max_tools: 5
  token_budget: 4096 # conservative UTF-8 byte bound for loaded skill context
preview:
  max_image_calls: 16
  mood_board: true
  mode: game # game = Spark writes the design and code (G2/G4 gates); muse = Muse blocks
game:
  max_repairs: 3 # Programmer fix rounds when syntax, runtime or playtest checks fail
  max_art_calls: 16 # Muse Image calls per build for entities the library cannot supply
  # Muse jobs run in parallel (Meta allows 150 image requests/min). Call slots are handed out
  # in priority order before dispatch, so the cap and the greybox choice stay deterministic.
  image_workers: 4
  # Identical requests (model, endpoint, prompt, size, reasoning strength, n, reference
  # hashes) reuse workspace/cache/muse-image/<sha256>.png: no call, no cost.
  image_cache: true
  art_retry: 1 # one redraw (reasoning_strength high) when a frame fails check_frame
  native_grid_confidence: 0.6 # below this, Muse art is fitted instead of read cell by cell
  # Muse sprites are drawn as sheets (a row of frames per animation, up to 4 rows): each
  # frame gets a slot of the image, so Muse draws it with fewer, bigger pixels, close to the
  # requested grid, and the sprite animates. 1 = one image per sprite.
  sheet_frames: 4
  # A Muse sprite's frame takes the shape Muse drew (about the design's area) instead of
  # squeezing it into the design box; the Programmer sees the real size in assets.json.
  adapt_size: true
  # Art Reviewer: after the playtest, Spark (vision) looks at all the art together and at 3
  # screenshots of the running game; blocking issues are fixed once before G4 with Muse Image
  # edits at its highest setting (the API has low and high), the rest are G4 suggestions.
  review: true
  review_max_fixes: 4
  review_image_reasoning: high
  max_code_kb: 200
  playtest_fps: 30
  record_seconds: 20
image:
  # Live smoke 2026-10-28: both paths accept size=1024x1024, b64_json,
  # output_format=png and reasoning_strength=low, but return 1600x1600 PNGs.
  # One data-URL reference verified; the maximum reference count is unverified.
  base_url: https://api.meta.ai
  model: muse-image-1.0
  generate_path: /v1/images/generations
  edit_path: /v1/images/edits
  # Request sizes (aspect ratio only). Art requests use the one nearest the subject's aspect.
  # tools/probe_art_spec.py 2026-10-31, all accepted: 1024x1024 -> 1600x1600,
  # 1792x1024 -> 2016x1152, 1024x1536 -> 1280x1920. With the grid wording Muse draws big
  # square pixels but chooses its own cell count (16x16 asked: 21x27 cells, ~46 px each).
  # tools/probe_sheet.py 2026-10-31: 2048x512 (4:1) accepted -> 3200x800.
  # tools/probe_layouts.py 2026-10-31: 1536x512 (3:1) accepted -> 2736x912.
  sizes: [[1024, 1024], [1792, 1024], [1024, 1536], [2048, 512], [1536, 512]]
llm:
  base_url: https://api.meta.ai
  model: muse-spark-1.3
  chat_path: /v1/chat/completions
  # Live probe 2026-10-30: strict json_schema {files:[{path,content}]} returned a complete
  # 375-line Phaser game (8578 completion tokens, finish_reason stop, 43 s); it ran without
  # errors. One call per game file set is enough; no output-length setting was needed.
  # tools/probe_spark_reasoning.py 2026-10-31: top-level reasoning_effort is accepted and
  # works (same question: low 113-119 reasoning tokens, max 366-455). Docs list minimal,
  # low, medium, high, xhigh, max ("none" -> HTTP 400). Prefix caching is automatic: a
  # repeated 1558-token prompt reported cached_tokens 1521 on a second run, also across
  # different efforts (0 on back-to-back calls of the very first run: the cache fills
  # shortly after a request). Prompts start with their stable part and send a
  # prompt_cache_key per task.
  reasoning:
    intake: low # G1 genre pick, brief draft, follow-up questions, style options
    art_plan: low # Art Director's library picks
    revision: low # Director splitting G4 feedback
    design: high # Game Designer's design doc and its revisions
    code: high # Programmer: new game, repairs, changes
    review: max # Art Reviewer (vision): the strongest setting Spark accepts
budget:
  max_image_calls: 150
  max_calls_per_model: 200
  image_cost: 0.01
  # Standard Spark USD / million tokens, verified 2026-10-29:
  # https://dev.meta.ai/docs/pricing-rate-limits
  spark_input_per_million: 1.25
  spark_cached_input_per_million: 0.15
  spark_output_per_million: 4.25
  max_estimated_cost: 5.0

memory:
  min_score: 0
  relative_score: 0.5
