workspace: ~/spriteforge-workspace
router:
  enabled: true
  max_skills: 3
  max_tools: 5
  token_budget: 4096 # conservative UTF-8 byte bound for loaded skill context
preview:
  max_image_calls: 16
  mood_board: true
  mode: game # game = Spark writes the design and code (G2/G4 gates); muse = Muse blocks
game:
  # Agent loops (Programmer repairs, Muse redraws, QA check fixes, Menu and Level retries, Art
  # Reviewer rounds) try again while they improve. A loop stops after `patience` tries in a
  # row without improvement, or when the agent has spent its budget.max_agent_cost ($10)
  # since your last action. max_repairs, max_art_calls, art_retry and review_max_fixes are
  # optional fixed limits on top (unset: none).
  patience: 2
  # Muse jobs run in parallel (Meta allows 150 image requests/min). Call slots are handed out
  # in priority order before dispatch, so the cap and the greybox choice stay deterministic.
  image_workers: 4
  # The game's screen: 320x180 design pixels times screen_scale. 6 = 1920x1080 (a laptop's
  # full-HD screen; sprites keep 6x the pixels Muse drew, text is 6x bigger); 4 = 1280x720.
  screen_scale: 6
  # The Level/Tile Designer studies the level design of similar platformers with web search
  # (one search call per game, before the first level); its level prompts read the findings.
  level_research: true
  # Muse Image's strength for every first draw: high (the API has low and high). Redraws and
  # the Art Reviewer's fixes use high as well.
  image_reasoning: high
  # Identical requests (model, endpoint, prompt, size, reasoning strength, n, reference
  # hashes) reuse workspace/cache/muse-image/<sha256>.png: no call, no cost.
  image_cache: true
  # A frame that fails check_frame is redrawn (reasoning_strength high) while redraws improve.
  native_grid_confidence: 0.6 # below this, Muse art is fitted instead of read cell by cell
  # Muse sprites are drawn as sheets (a row of frames per animation, up to 4 rows): each
  # frame gets a slot of the image, so Muse draws it with fewer, bigger pixels, close to the
  # requested grid, and the sprite animates. 1 = one image per sprite.
  sheet_frames: 4
  # A Muse sprite's frame takes the shape Muse drew (about the design's area) instead of
  # squeezing it into the design box; the Programmer sees the real size in assets.json.
  adapt_size: true
  # Art Reviewer: after the playtest, Spark (vision) looks at all the art together and at 3
  # screenshots of the running game; blocking issues are fixed before G4 with Muse Image
  # edits at its highest setting (the API has low and high), then it reviews again while the
  # blocking issues go down (patience, its $10 allowance); the rest are G4 suggestions.
  review: true
  review_image_reasoning: high
  # QA Playtester: tests written from each design version (one Spark call), played with real
  # key presses after the bot playtest; failures join the repairs; exported per build as
  # build/tests/test_game_qa.py (pytest + Playwright).
  qa: true
  # Motion design (L2.4): the Art Director writes every entity's animation rows (what each
  # frame shows, fps, loop), how the player looks in each form and the effects the SDK plays
  # (sf.fx); Muse draws the rows, code checks and repairs them. false = the design's names.
  motion: true
  # Menus and flow (L2.5): the Menu Designer writes the menus as data (one Spark call per game;
  # feedback revises them), the SDK renders them in the art's colours and runs the flow (title,
  # pause, results, game over, victory, progress saved in the browser); G3 shows every screen
  # before the playtest. title_art: Muse draws the title background and an emblem (2 image
  # calls, locked once drawn; false: code draws them from the game's art).
  menus: true
  title_art: true
  # Sounds (L2.7): the Sound Director picks a synthesised sound for every moment (one Spark
  # call; no audio files, no image calls); the SDK plays them, the build's sounds.html edits them.
  sounds: true
  # Agent tools: in a live build each agent may look things up before it answers, with the
  # tools its role grants (allowed_tools in agents/roles/*.md: the built-in library and game
  # record MCP servers), its skills (load_skill) and your MCP tools granted to it that need no
  # confirmation. Each round is one more Spark call; false: one call per answer, no tools.
  agent_tools: true
  tool_rounds: 3
  # (No story switch: the G1 brief decides. A story bible is written only when the human asks
  # for one; every game keeps its full record as an OKF bundle in runs/<id>/game/db.)
  max_code_kb: 200
  playtest_fps: 30
  record_seconds: 20
image:
  # Live smoke 2026-10-28: both paths accept size=1024x1024, b64_json,
  # output_format=png and reasoning_strength=low, but return 1600x1600 PNGs.
  # One data-URL reference verified; the maximum reference count is unverified.
  base_url: https://api.meta.ai
  model: muse-image-1.0
  generate_path: /v1/images/generations
  edit_path: /v1/images/edits
  # Request sizes (aspect ratio only). Art requests use the one nearest the subject's aspect.
  # Live probe 2026-10-31, all accepted: 1024x1024 -> 1600x1600,
  # 1792x1024 -> 2016x1152, 1024x1536 -> 1280x1920. With the grid wording Muse draws big
  # square pixels but chooses its own cell count (16x16 asked: 21x27 cells, ~46 px each).
  # Live probe 2026-10-31: 2048x512 (4:1) accepted -> 3200x800.
  # Live probe 2026-10-31: 1536x512 (3:1) accepted -> 2736x912.
  sizes: [[1024, 1024], [1792, 1024], [1024, 1536], [2048, 512], [1536, 512]]
llm:
  base_url: https://api.meta.ai
  model: muse-spark-1.3
  chat_path: /v1/chat/completions
  # Live probe 2026-10-30: strict json_schema {files:[{path,content}]} returned a complete
  # 375-line Phaser game (8578 completion tokens, finish_reason stop, 43 s); it ran without
  # errors. One call per game file set is enough; no output-length setting was needed.
  # Live probe 2026-10-31: top-level reasoning_effort is accepted and
  # works (same question: low 113-119 reasoning tokens, max 366-455). Docs list minimal,
  # low, medium, high, xhigh, max ("none" -> HTTP 400). Prefix caching is automatic: a
  # repeated 1558-token prompt reported cached_tokens 1521 on a second run, also across
  # different efforts (0 on back-to-back calls of the very first run: the cache fills
  # shortly after a request). Prompts start with their stable part and send a
  # prompt_cache_key per task.
  reasoning:
    intake: low # G1 genre pick, brief draft, follow-up questions, style options
    art_plan: low # Art Director's library picks
    revision: low # Director splitting G4 feedback
    design: high # Game Designer's design doc and its revisions
    code: high # Programmer: new game, repairs, changes
    review: max # Art Reviewer (vision): the strongest setting Spark accepts
    describe: low # Librarian describing library images (spriteforge library describe)
    qa: high # QA Playtester writing tests from the design
    story: high # Game Designer writing the story bible
    research: medium # Game Designer studying similar games with web search (L2.2)
    plan: high # Game Designer writing the game plan from the requirements and research
    level: high # Level/Tile Designer writing each level as data (L2.3)
    motion: medium # Art Director's motion design: rows, forms, effects (L2.4)
    menus: medium # Menu Designer: the menus as data and their revisions (L2.5)
    sounds: low # Sound Director: a preset and tweaks per moment, and their revisions (L2.7)
    lessons: low # Librarian: lessons from a finished game, shown at G5 (L2.6)
research:
  # Live probe 2026-11-02: Chat Completions rejects {"type": "web_search"}
  # (HTTP 400 "tools[0] did not match any supported type"); the Responses API accepts it.
  # Citations: `url_citation` annotations on output_text (few), and with
  # include ["web_search_call.action.sources"] every search lists the pages it returned
  # (11-12 each). json_schema (text.format, strict) and web_search work in one call: the last
  # `message` item holds the JSON (earlier ones are progress lines). A URL in the JSON is not
  # always one a search returned, so code checks every reference URL against the sources.
  # Searches are not in `usage`: each `web_search_call` item (search or open_page) is counted
  # as one search (budget.web_search_cost). One probe research: 10.8k input + 2.1k output
  # tokens (low effort) and 4 tool calls, about $0.03.
  path: /v1/responses
  max_searches: 8 # max_tool_calls per research
  search_context_size: medium
budget:
  max_image_calls: 150
  max_calls_per_model: 200
  image_cost: 0.01
  # Standard Spark USD / million tokens, verified 2026-10-29:
  # https://dev.meta.ai/docs/pricing-rate-limits
  spark_input_per_million: 1.25
  spark_cached_input_per_million: 0.15
  spark_output_per_million: 4.25
  # https://dev.meta.ai/docs/pricing-rate-limits 2026-11-02: $2.50 per 1,000 search queries
  web_search_cost: 0.0025
  max_estimated_cost: 5.0 # per run, legacy stages only (per_request: false)
  # Each agent may spend max_agent_cost (USD) since your last action (a gate answer, Go back,
  # Continue); its loops run until that is used up or they stop improving (game.patience).
  # Work you ask for always starts.
  per_request: true
  max_agent_cost: 10

memory:
  min_score: 0
  relative_score: 0.5
