<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>SpriteForge</title><style>
.concept-preview{width:100%!important;height:auto!important;max-width:960px!important}
.concept-figure{width:100%;max-width:960px}.swatch-field{display:inline-block;margin:8px;padding:8px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.asset-card{border:1px solid #556;padding:12px;overflow-wrap:anywhere}.asset-card img{width:auto;height:auto;max-width:192px;max-height:192px}.asset-pass{color:#9ae6b4}.asset-fail{color:#ffb4b4}.production-sheet{width:100%!important;height:auto!important}
body{background:#151822;color:#e2e8f0;font:16px system-ui;margin:40px auto;max-width:960px;padding:0 20px}
h1{color:#9ae6b4}select{padding:8px;max-width:100%}li{padding:8px;border-bottom:1px solid #333}
#artifacts,#gate-artifacts{display:flex;gap:24px;flex-wrap:wrap}img{width:128px;height:128px;image-rendering:pixelated;background:#303447}
.muted{color:#a8b3c7}#error{color:#ffb4b4}figure{margin:0}pre{white-space:pre-wrap;max-width:800px;overflow-wrap:anywhere}textarea{display:block;width:95%;min-height:80px}fieldset{margin:16px 0}button{padding:10px;margin:6px}#gate-panel{border:2px solid #9ae6b4;padding:16px}#gate-artifacts img{width:auto;max-width:100%;height:160px}figcaption{padding:8px}
</style></head><body><h1>SpriteForge</h1><p class="muted">Local game builder · human approval gates</p>
<details id="extensions"><summary>Skills and MCP servers</summary>
<label>Agent role <select id="extension-role"></select></label><h3>Available skills</h3><div id="skill-list"></div>
<h3>MCP servers</h3><p>Inspect tools, then explicitly enable a server for the selected role. Every tool requires confirmation by default.</p><div id="mcp-list"></div><p id="extension-error" role="alert"></p>
<label>Tool name (server.tool) <input id="mcp-tool"></label><label>Tool arguments (JSON)<textarea id="mcp-arguments">{}</textarea></label><button id="mcp-call" type="button">Request tool call</button>
</details><section id="mcp-confirmations" aria-label="MCP confirmations"></section>
<label>Run <select id="runs" aria-label="Select run"></select></label>
<p id="status" role="status">Connecting…</p><p id="usage"></p><p id="error" role="alert"></p>
<section id="production-panel" hidden aria-label="Production assets"><h2>Asset production</h2><p id="production-mode"></p><p id="set-review"></p><div id="production-assets"></div></section>
<section id="gate-panel" hidden aria-labelledby="gate-title">
<h2 id="gate-title"></h2><div id="gate-artifacts"></div><div id="change-requests"></div>
<form id="gate-form"><div id="custom-fields"></div>
<fieldset id="tags"><legend>Feedback tags</legend>
<label><input type="checkbox" value="art">Art</label>
<label><input type="checkbox" value="gameplay">Gameplay</label>
<label><input type="checkbox" value="controls">Controls</label>
<label><input type="checkbox" value="difficulty">Difficulty</label>
<label><input type="checkbox" value="bug">Bug</label></fieldset>
<label for="feedback-text">Feedback</label><textarea id="feedback-text"></textarea>
<button type="submit" value="approve">Approve</button>
<button id="request-changes" type="submit" value="request_changes">Request changes</button>
<button type="submit" value="abort">Abort</button><p id="gate-error" role="alert"></p>
</form></section><h2>Artifacts</h2><div id="artifacts"></div><h2>Timeline</h2><ol id="timeline"></ol>
<script>
const $=id=>document.getElementById(id);let source, selected;
let renderedGate=null;
async function extensionPost(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data;}
async function extensionAction(fn){try{$('extension-error').textContent='';await fn();await loadExtensions();await loadConfirmations();}catch(e){$('extension-error').textContent=e.message;}}
async function loadExtensions(){const data=await(await fetch('/api/extensions')).json();const pick=$('extension-role');if(!pick.options.length)for(const role of data.roles){const option=new Option(role,role);pick.add(option);}
 const role=pick.value;$('skill-list').replaceChildren();for(const skill of data.skills[role]||[]){const p=document.createElement('p');p.textContent=skill.name+' — '+skill.description;$('skill-list').append(p);}
 $('mcp-list').replaceChildren();for(const [name,server] of Object.entries(data.servers)){const box=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=name+' — '+(Object.hasOwn(server.enabled_roles,role)?'enabled for '+role:'disabled for '+role);box.append(legend);
 const inspect=document.createElement('button');inspect.textContent='Inspect tools: '+name;inspect.type='button';inspect.onclick=()=>extensionAction(()=>extensionPost('/api/mcp/'+name+'/inspect'));box.append(inspect);
 const enable=document.createElement('button');const enabled=Object.hasOwn(server.enabled_roles,role);enable.textContent=(enabled?'Disable ':'Enable ')+name+' for '+role;enable.type='button';enable.disabled=!server.discovered_fingerprint;enable.onclick=()=>extensionAction(()=>extensionPost('/api/mcp/'+name+'/enable',{role,enabled:!enabled}));box.append(enable);
 for(const tool of server.tools){const p=document.createElement('p');p.textContent=name+'.'+tool.name+' — '+(tool.description||'');box.append(p);const label=document.createElement('label'),toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=server.confirmation[tool.name]!==false;toggle.onchange=()=>extensionAction(()=>extensionPost('/api/mcp/'+name+'/policy',{tool:tool.name,confirm:toggle.checked}));label.append(toggle,document.createTextNode(' Require human confirmation for '+name+'.'+tool.name));box.append(label);const schema=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Arguments';pre.textContent=JSON.stringify(tool.inputSchema,null,2);schema.append(summary,pre);box.append(schema);}$('mcp-list').append(box);}}
async function loadConfirmations(){if(!selected)return;const current=selected;const calls=await(await fetch('/api/runs/'+current+'/mcp/confirmations')).json();if(selected!==current)return;$('mcp-confirmations').replaceChildren();for(const call of calls){const box=document.createElement('fieldset'),title=document.createElement('legend'),pre=document.createElement('pre');title.textContent='Confirm MCP call: '+call.tool+' ('+call.role+')';pre.textContent=JSON.stringify(call.arguments,null,2);box.append(title,pre);for(const approve of [true,false]){const b=document.createElement('button');b.textContent=approve?'Approve tool call':'Deny tool call';b.onclick=()=>extensionAction(async()=>{b.disabled=true;await extensionPost('/api/runs/'+current+'/mcp/confirmations/'+encodeURIComponent(call.id),{approve});await refresh();});box.append(b);}$('mcp-confirmations').append(box);}}
$('extension-role').onchange=()=>extensionAction(async()=>{});
$('mcp-call').onclick=()=>extensionAction(async()=>{if(!selected)throw new Error('Select an active run first');await extensionPost('/api/runs/'+selected+'/mcp/call',{role:$('extension-role').value,tool:$('mcp-tool').value,arguments:JSON.parse($('mcp-arguments').value)});});
loadExtensions().catch(e=>{$('extension-error').textContent=e.message;});setInterval(()=>loadConfirmations().catch(()=>{}),1500);
async function renderArtifact(a,container){
 const fig=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=a.name;
 if(a.mime.startsWith('image/')){const img=document.createElement('img');img.src='/api/artifacts/'+a.id;img.alt=a.name;
 if(a.name.startsWith('concept/')){img.className='concept-preview';fig.className='concept-figure';cap.textContent=a.name+' · CONCEPT — not final art'+(a.name.includes('-pixel')?' · Pixel-true preview (320×180, nearest-neighbor 3×)':'');}
 if(a.name.endsWith('/contact-sheet.png'))img.className='production-sheet';
 fig.append(img);}
 else if(a.mime==='application/json'){const pre=document.createElement('pre');
 pre.textContent=JSON.stringify(await(await fetch('/api/artifacts/'+a.id)).json(),null,2);fig.append(pre);}
 fig.append(cap);container.append(fig);
}
let refreshing=false,refreshAgain=false;
async function refresh(){if(refreshing){refreshAgain=true;return;}refreshing=true;try{await refreshRun();}catch(error){$('error').textContent='Could not refresh the run. Check the local server connection: '+error.message;}finally{refreshing=false;if(refreshAgain){refreshAgain=false;refresh();}}}
async function refreshRun(){const current=selected;const d=await (await fetch('/api/runs/'+current)).json();
 if(current!==selected)return;
 $('status').textContent=d.run.status+' · checkpoint '+d.run.cursor;
 $('error').textContent=d.error||'';
 $('usage').textContent=d.usage?`${d.usage.image_calls} / ${d.usage.cap} image calls · estimated cost $${d.usage.estimated_cost.toFixed(2)} (configured estimate)`:'';
 renderProduction(d);
 $('artifacts').replaceChildren();for(const a of d.artifacts.filter(a=>a.mime.startsWith('image/')&&(!a.name.startsWith('production/')||a.name.endsWith('/sprite.png')))){await renderArtifact(a,$('artifacts'));}
 if(current!==selected)return;
 const g=d.gate;
 if(!g){$('gate-panel').hidden=true;renderedGate=null;return;}if(renderedGate===g.id){$('gate-panel').hidden=false;return;}
 $('gate-panel').hidden=true;renderedGate=null;
 $('gate-title').textContent=g.title;$('gate-form').reset();$('gate-error').textContent='';
 $('gate-artifacts').replaceChildren();for(const id of g.artifacts_to_show){const a=d.artifacts.find(a=>a.id===id);if(a)await renderArtifact(a,$('gate-artifacts'));}
 $('change-requests').replaceChildren();
 if(g.changes){for(const c of g.changes.requests){const p=document.createElement('p');
 p.textContent='Target: '+JSON.stringify(c.target)+' | '+c.instruction+' | '+c.severity+' | '+c.scope+' | Regenerate: '+c.needs_regen;
 $('change-requests').append(p);}}
 $('request-changes').hidden=g.kind==='confirm_changes'||(d.run.config.workflow==='intake-concept-v1'&&!['concept','assets'].includes(g.stage));$('tags').hidden=g.kind==='confirm_changes';
 $('custom-fields').replaceChildren();
 if(g.form_schema.title!=='Feedback')for(const [name,rule] of Object.entries(g.form_schema.properties||{})){
 const label=document.createElement('label');label.textContent=rule.title||name;
 let input;
 if(rule.enum){input=document.createElement('select');for(const v of rule.enum){const o=document.createElement('option');o.value=v;o.textContent=v;input.append(o);}}
 else{input=document.createElement('input');input.type=rule.format==='color'?'color':rule.type==='boolean'?'checkbox':(['integer','number'].includes(rule.type)?'number':'text');}
 input.name=name;input.dataset.kind=rule.type||'string';input.required=(g.form_schema.required||[]).includes(name);if(rule.default!==undefined)input.value=rule.default;
 label.append(input);const box=document.createElement('fieldset');box.append(label);
 if(rule.format==='color')box.className='swatch-field';
 if(rule.suggestions&&rule.format!=='color'){const choices=document.createElement('div');
 for(const value of rule.suggestions){const chip=document.createElement('button');chip.type='button';chip.textContent=value;chip.onclick=()=>{input.value=value;};choices.append(chip);}box.append(choices);
 const suggest=document.createElement('button');suggest.type='button';suggest.textContent="I'm not sure, suggest options";suggest.onclick=()=>{choices.hidden=false;choices.style.border='1px solid #9ae6b4';choices.querySelector('button')?.focus();};box.append(suggest);
 const skip=document.createElement('button');skip.type='button';skip.textContent='Skip / use default';skip.onclick=()=>{input.value=rule.default||'';};box.append(skip);}
 $('custom-fields').append(box);}
 const optionsArtifact=d.artifacts.find(a=>a.name==='options.json');
 if(g.stage==='styles'&&optionsArtifact){const options=await(await fetch('/api/artifacts/'+optionsArtifact.id)).json();
 for(const option of options.options){const box=document.createElement('fieldset');const title=document.createElement('legend');title.textContent=option.name;box.append(title);const desc=document.createElement('p');desc.textContent=option.description;box.append(desc);
 for(const color of option.colors){const swatch=document.createElement('span');swatch.style.cssText='display:inline-block;width:42px;height:42px;margin:4px';swatch.style.backgroundColor=color;swatch.title=color;box.append(swatch);}$('custom-fields').append(box);}}
 if(current!==selected)return;renderedGate=g.id;$('gate-panel').hidden=false;
}
function renderProduction(d){
 const panel=$('production-panel');panel.hidden=!d.production;if(!d.production)return;
 $('production-mode').textContent=d.run.config.mock?'Mock preview: synthetic images and scripted critic scores.':'Muse asset production with pixel checks and visual review.';
 const issues=d.production.consistency?.issues||[];$('set-review').textContent=d.production.consistency?`Set style score: ${d.production.consistency.style_match}/5. `+(issues.length?'Review issues: '+issues.map(i=>i.asset_ids.join(', ')+': '+i.issue+' '+i.fix).join(' | '):'No set consistency issues reported.'):'Production in progress; accepted assets are saved.';
 $('production-assets').replaceChildren();
 for(const type of ['character','tile','item','ui','fx']){
 const records=d.production.assets.filter(r=>r.type===type);if(!records.length)continue;
 const heading=document.createElement('h3');heading.textContent=type;const grid=document.createElement('div');grid.className='asset-grid';
 for(const r of records){const card=document.createElement('article');card.className='asset-card';card.dataset.assetId=r.id;const title=document.createElement('h4');title.textContent=r.id;card.append(title);
 const a=d.artifacts.find(a=>a.name===r.artifact);if(a){const img=document.createElement('img');img.src='/api/artifacts/'+a.id;img.alt=r.id;img.onload=()=>{img.style.width=(img.naturalWidth*4)+'px';};card.append(img);}
 const failed=r.status!=='accepted'||issues.some(i=>i.asset_ids.includes(r.id));const badge=document.createElement('p');badge.className=failed?'asset-fail':'asset-pass';badge.textContent=(failed?'FAIL / '+(r.status==='placeholder'?'PLACEHOLDER':'SET REVIEW'):'PASS')+` · attempts ${r.attempts}/3 · v${r.version}`;card.append(badge);
 if(r.scores){const scores=document.createElement('p');scores.textContent=`Style ${r.scores.style_match}/5 · Readability ${r.scores.readability}/5`;card.append(scores);}
 if(r.issues.length){const detail=document.createElement('p');detail.textContent=r.issues.join('; ');card.append(detail);}
 if(d.gate?.stage==='assets'){const button=document.createElement('button');button.type='button';button.textContent='Change '+r.id;button.onclick=()=>{const input=$('custom-fields').querySelector('[name="targets"]');if(input){input.value=r.id;input.focus();}$('feedback-text').focus();};card.append(button);}grid.append(card);}
 $('production-assets').append(heading,grid);}
}
$('gate-form').onsubmit=async e=>{e.preventDefault();const gate=renderedGate;if(!gate)return;
 const form={};for(const input of $('custom-fields').querySelectorAll('input,select')){
 form[input.name]=input.dataset.kind==='boolean'?input.checked:(['integer','number'].includes(input.dataset.kind)?Number(input.value):input.value);}
 const body={action:e.submitter.value,tags:[...$('tags').querySelectorAll('input:checked')].map(i=>i.value),text:$('feedback-text').value,form};
 for(const b of $('gate-form').querySelectorAll('button'))b.disabled=true;
 try{const response=await fetch('/api/runs/'+selected+'/gates/'+gate,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:JSON.stringify(result.detail));
 await refresh();}catch(err){$('gate-error').textContent=err.message;}finally{for(const b of $('gate-form').querySelectorAll('button'))b.disabled=false;}
};
function choose(){if(source)source.close();selected=$('runs').value;renderedGate=null;$('timeline').replaceChildren();refresh();
 source=new EventSource('/api/runs/'+selected+'/events');source.onmessage=e=>{const d=JSON.parse(e.data);
 const li=document.createElement('li');li.textContent=d.timestamp+' · '+d.agent+' · '+d.type+' · '+(d.payload.message||'');
 $('timeline').append(li);refresh();};source.addEventListener('done',()=>{source.close();refresh();});
 source.addEventListener('worker-error',e=>{$('error').textContent=JSON.parse(e.data);source.close();});}
fetch('/api/runs').then(r=>r.json()).then(d=>{for(const r of d.runs){const o=document.createElement('option');
 o.value=r.id;o.textContent=r.id+' · '+r.status;$('runs').append(o);}if(d.active)$('runs').value=d.active;
 if(d.error)$('error').textContent=d.error;if(d.runs.length)choose();else $('status').textContent='No runs yet';})
 .catch(e=>{$('error').textContent=e.message;});$('runs').onchange=choose;
</script></body></html>
